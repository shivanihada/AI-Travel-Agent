<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - AI Travel Agent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e3c72; display: flex;
           justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 12px; width: 320px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 10px; background: #1e3c72; color: #fff; border: none;
             border-radius: 6px; font-size: 16px; cursor: pointer; }
    #otpBox { display: none; }
    #msg { color: red; font-size: 14px; }
    #demo { color: green; font-weight: bold; }
  </style>
<style>
  body {
    background: linear-gradient(rgba(15,23,42,.35), rgba(15,23,42,.35)),
                url('/static/bg3.jpg') center / cover fixed no-repeat !important;
  }
</style>

</head>
<body>
  <div class="box">
    <h2>AI Travel Agent</h2>
    <div id="phoneBox">
      <input id="phone" placeholder="10 digit phone number" maxlength="10">
      <button onclick="sendOtp()">Send OTP</button>
    </div>
    <div id="otpBox">
      <p id="demo"></p>
      <input id="otp" placeholder="Enter OTP" maxlength="6">
      <button onclick="verifyOtp()">Verify &amp; Login</button>
    </div>
    <p id="msg"></p>
  </div>

  <script>
    async function sendOtp() {
      const phone = document.getElementById("phone").value;
      const r = await fetch("/send-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({phone: phone})
      });
      const d = await r.json();
      if (d.ok) {
        document.getElementById("phoneBox").style.display = "none";
        document.getElementById("otpBox").style.display = "block";
        document.getElementById("demo").innerText = "Demo OTP: " + d.demo_otp;
        document.getElementById("msg").innerText = "";
      } else {
        document.getElementById("msg").innerText = d.error;
      }
    }

    async function verifyOtp() {
      const otp = document.getElementById("otp").value;
      const r = await fetch("/verify-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({otp: otp})
      });
      const d = await r.json();
      if (d.ok) { window.location.href = d.next; }
      else { document.getElementById("msg").innerText = d.error; }
    }
  </script>
</body>
</html></app>
