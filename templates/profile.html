<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - AI Travel Agent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e3c72; display: flex;
           justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; padding: 30px; border-radius: 12px; width: 340px; }
    h2 { text-align: center; margin-top: 0; }
    label { font-size: 14px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; padding: 10px; background: #1e3c72; color: #fff; border: none;
             border-radius: 6px; font-size: 16px; cursor: pointer; }
    #msg { color: red; font-size: 14px; text-align: center; }
  </style>
  <style>
  body {
    background: linear-gradient(rgba(15,23,42,.35), rgba(15,23,42,.35)),
                url('/static/bg3.jpg') center / cover fixed no-repeat !important;
  }
</style>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e3a73">
<link rel="icon" href="/static/icon-192.png">
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script></head>
<body>
  <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
  <div class="box">
    <h2>Set up your profile</h2>

    <label>Your name</label>
    <input id="name" value="{{ u[0] or '' }}" placeholder="e.g. Shivani">

    <label>Usual trip budget (INR)</label>
    <input id="budget" value="{{ u[1] or '' }}" placeholder="e.g. 15000">

    <label>Travel style</label>
    <select id="style">
      {% for s in ["Budget", "Comfortable", "Luxury", "Adventure", "Relaxed"] %}
      <option value="{{ s }}" {% if u[2] == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>

    <label>Purpose of travel</label>
    <select id="purpose">
      {% for p in ["Leisure", "Friends trip", "Family", "Solo", "Honeymoon", "Business"] %}
      <option value="{{ p }}" {% if u[3] == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>

    <button onclick="saveProfile()">Save &amp; Continue</button>
    <p id="msg"></p>
  </div>

  <script>
    async function saveProfile() {
      const r = await fetch("/save-profile", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name: document.getElementById("name").value,
          budget: document.getElementById("budget").value,
          travel_style: document.getElementById("style").value,
          purpose: document.getElementById("purpose").value
        })
      });
      const d = await r.json();
      if (d.ok) { window.location.href = d.next; }
      else { document.getElementById("msg").innerText = d.error; }
    }
  </script>
</body>
</html>
